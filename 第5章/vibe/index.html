<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>都市名で天気</title>
    <meta
      name="description"
      content="都市名から現在の天気を表示（ブラウザのみ、APIキー不要）"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1 class="title">都市名で天気</h1>
        <p class="subtitle">
          都市名を入力すると、現在の天気を表示します（APIキー不要）。
        </p>
      </header>

      <section class="card">
        <form id="searchForm" class="form" autocomplete="off">
          <label class="label" for="cityInput">都市名</label>
          <div class="row">
            <input
              id="cityInput"
              name="city"
              class="input"
              inputmode="search"
              placeholder="例: Tokyo, Sapporo, Osaka, New York"
              required
              minlength="1"
            />
            <button id="searchButton" class="button" type="submit">検索</button>
          </div>
          <p class="hint">
            ヒント: 「Tokyo, JP」「Paris, FR」のように国を付けると絞り込めます。
          </p>
        </form>

        <div id="spinner" class="spinner" hidden></div>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <div id="result" class="result" hidden>
          <div class="resultHeader">
            <div>
              <div id="placeName" class="placeName"></div>
              <div id="placeMeta" class="placeMeta"></div>
            </div>
            <div class="badge" id="weatherBadge"></div>
          </div>

          <div class="grid">
            <div class="metric">
              <div class="metricLabel">現在の気温</div>
              <div class="metricValue">
                <span id="tempNow">-</span><span class="unit">℃</span>
              </div>
            </div>
            <div class="metric">
              <div class="metricLabel">体感</div>
              <div class="metricValue">
                <span id="apparentTemp">-</span><span class="unit">℃</span>
              </div>
            </div>
            <div class="metric">
              <div class="metricLabel">風</div>
              <div class="metricValue">
                <span id="windNow">-</span><span class="unit">m/s</span>
              </div>
            </div>
            <div class="metric">
              <div class="metricLabel">降水確率（今日）</div>
              <div class="metricValue">
                <span id="precipProbMax">-</span><span class="unit">%</span>
              </div>
            </div>
          </div>

          <div class="details">
            <div class="detailsItem">
              <span class="detailsLabel">最高/最低（今日）</span>
              <span class="detailsValue"
                ><span id="tempMax">-</span>℃ /
                <span id="tempMin">-</span>℃</span
              >
            </div>
            <div class="detailsItem">
              <span class="detailsLabel">更新</span>
              <span class="detailsValue" id="updatedAt">-</span>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <small>
          データ提供:
          <a href="https://open-meteo.com/" target="_blank" rel="noreferrer"
            >Open‑Meteo</a
          >
        </small>
      </footer>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
