<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シンプルじゃんけん</title>
    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        text-align: center;
        background-color: #f0f2f5;
        margin: 0;
        padding: 50px 20px;
      }
      .container {
        background-color: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        margin: 0 auto;
      }
      h1 {
        color: #333;
      }
      .choices {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 30px 0;
      }
      button {
        font-size: 2rem;
        padding: 15px 25px;
        cursor: pointer;
        border: none;
        border-radius: 10px;
        background-color: #e9ecef;
        transition:
          transform 0.2s,
          background-color 0.2s;
      }
      button:hover {
        background-color: #dee2e6;
        transform: scale(1.1);
      }
      button:active {
        transform: scale(0.95);
      }
      #result-display {
        margin-top: 20px;
        font-size: 1.2rem;
        min-height: 100px;
      }
      .message {
        font-weight: bold;
        font-size: 1.5rem;
        margin-top: 10px;
        color: #007bff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>じゃんけんポン！</h1>
      <p>出す手を選んでね</p>

      <div class="choices">
        <button onclick="play('✊')">✊</button>
        <button onclick="play('✌️')">✌️</button>
        <button onclick="play('🖐️')">🖐️</button>
      </div>

      <div id="result-display">
        <div id="user-choiceText">あなたの手: -</div>
        <div id="pc-choiceText">相手の手: -</div>
        <div id="game-message" class="message">いざ勝負！</div>
      </div>
    </div>

    <script>
      function play(userHand) {
        const hands = ["✊", "✌️", "🖐️"];
        const pcHand = hands[Math.floor(Math.random() * hands.length)];

        // 結果の判定
        let result = "";
        if (userHand === pcHand) {
          result = "引き分け！";
        } else if (
          (userHand === "✊" && pcHand === "✌️") ||
          (userHand === "✌️" && pcHand === "🖐️") ||
          (userHand === "🖐️" && pcHand === "✊")
        ) {
          result = "あなたの勝ち！ ✨";
        } else {
          result = "あなたの負け... 😢";
        }

        // 画面に表示
        document.getElementById("user-choiceText").innerText =
          `あなたの手: ${userHand}`;
        document.getElementById("pc-choiceText").innerText =
          `相手の手: ${pcHand}`;
        document.getElementById("game-message").innerText = result;
      }
    </script>
  </body>
</html>
