<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メモアプリ</title>

    <style>
      body {
        font-family: sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        margin: auto;
      }

      h1 {
        text-align: center;
      }

      .input-area {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
      }

      button {
        padding: 12px 16px;
        border: none;
        background: #4f46e5;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #4338ca;
      }

      .memo {
        background: white;
        padding: 14px;
        border-radius: 10px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .delete-btn {
        background: #ef4444;
      }

      .delete-btn:hover {
        background: #dc2626;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>メモアプリ</h1>

      <div class="input-area">
        <input type="text" id="memoInput" placeholder="メモを書く..." />
        <button onclick="addMemo()">追加</button>
      </div>

      <div id="memoList"></div>
    </div>

    <script>
      let memos = JSON.parse(localStorage.getItem("memos")) || [];

      function saveMemos() {
        localStorage.setItem("memos", JSON.stringify(memos));
      }

      function renderMemos() {
        const memoList = document.getElementById("memoList");
        memoList.innerHTML = "";

        memos.forEach((memo, index) => {
          const memoDiv = document.createElement("div");
          memoDiv.className = "memo";

          memoDiv.innerHTML = `
          <span>${memo}</span>
          <button class="delete-btn" onclick="deleteMemo(${index})">削除</button>
        `;

          memoList.appendChild(memoDiv);
        });
      }

      function addMemo() {
        const input = document.getElementById("memoInput");
        const text = input.value.trim();

        if (text === "") return;

        memos.push(text);
        saveMemos();
        renderMemos();

        input.value = "";
      }

      function deleteMemo(index) {
        memos.splice(index, 1);
        saveMemos();
        renderMemos();
      }

      renderMemos();
    </script>
  </body>
</html>
