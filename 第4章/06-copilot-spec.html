<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>WEBメモアプリ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto py-8 px-4">
      <header class="mb-6">
        <h1 class="text-3xl font-bold text-gray-800">WEBメモアプリ</h1>
        <p class="text-sm text-gray-500 mt-1">
          ブラウザの localStorage に保存されるシンプルなメモアプリです。
        </p>
      </header>

      <!-- メッセージ表示領域 -->
      <div id="messageArea" class="space-y-2 mb-4"></div>

      <!-- メモ編集フォーム -->
      <section class="bg-white shadow rounded p-4 mb-6">
        <h2 class="text-xl font-semibold mb-3 text-gray-800">
          メモの作成・編集
        </h2>
        <form id="memoForm" class="space-y-4">
          <input type="hidden" id="memoId" />

          <div>
            <label
              for="title"
              class="block text-sm font-medium text-gray-700 mb-1"
              >タイトル<span class="text-red-500">*</span></label
            >
            <input
              id="title"
              type="text"
              class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="タイトルを入力"
            />
          </div>

          <div>
            <label
              for="body"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              本文（最大 10,000 文字）
            </label>
            <textarea
              id="body"
              rows="6"
              class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="本文を入力"
            ></textarea>
            <p id="bodyCount" class="text-xs text-gray-500 mt-1 text-right"></p>
          </div>

          <div id="formError" class="text-sm text-red-600"></div>

          <div class="flex items-center gap-2">
            <button
              type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded"
            >
              保存
            </button>
            <button
              type="button"
              id="resetButton"
              class="text-sm text-gray-600 hover:text-gray-800"
            >
              新規作成に戻す
            </button>
          </div>
        </form>
      </section>

      <!-- メモ一覧 -->
      <section class="bg-white shadow rounded p-4">
        <h2 class="text-xl font-semibold mb-3 text-gray-800">メモ一覧</h2>
        <div id="emptyState" class="text-sm text-gray-500">
          メモはまだありません。
        </div>
        <ul id="memoList" class="divide-y divide-gray-200 mt-2"></ul>
      </section>
    </div>

    <script>
      // 固定仕様
      const STORAGE_KEY = "web-memo-app";
      const MAX_BODY_LENGTH = 10000;

      /**
       * @typedef {Object} Memo
       * @property {string} id
       * @property {string} title
       * @property {string} body
       * @property {string} updatedAt ISO 8601 文字列
       */

      /** @type {Memo[]} */
      let memos = [];

      const messageArea = document.getElementById("messageArea");
      const memoForm = document.getElementById("memoForm");
      const memoIdInput = document.getElementById("memoId");
      const titleInput = document.getElementById("title");
      const bodyInput = document.getElementById("body");
      const bodyCount = document.getElementById("bodyCount");
      const formError = document.getElementById("formError");
      const resetButton = document.getElementById("resetButton");
      const memoList = document.getElementById("memoList");
      const emptyState = document.getElementById("emptyState");

      function showMessage(text, type = "info") {
        const div = document.createElement("div");
        div.className =
          "text-sm px-3 py-2 rounded border " +
          (type === "error"
            ? "bg-red-50 border-red-300 text-red-700"
            : "bg-yellow-50 border-yellow-300 text-yellow-800");
        div.textContent = text;
        messageArea.appendChild(div);
      }

      function clearMessages() {
        messageArea.innerHTML = "";
      }

      function updateBodyCount() {
        const len = bodyInput.value.length;
        bodyCount.textContent = `${len} / ${MAX_BODY_LENGTH} 文字`;
      }

      function validateInput(title, body) {
        if (!title.trim()) {
          return "タイトルは必須です。";
        }
        if (body.length > MAX_BODY_LENGTH) {
          return `本文は最大 ${MAX_BODY_LENGTH} 文字までです。`;
        }
        return null;
      }

      function saveMemos() {
        try {
          const json = JSON.stringify(memos);
          localStorage.setItem(STORAGE_KEY, json);
        } catch (e) {
          showMessage(
            "保存に失敗しました。ブラウザの保存機能が無効になっている可能性があります。",
            "error",
          );
        }
      }

      function loadMemos() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          memos = [];
          return;
        }
        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            throw new Error("not array");
          }
          const valid = [];
          for (const item of parsed) {
            if (
              item &&
              typeof item.id === "string" &&
              typeof item.title === "string" &&
              typeof item.body === "string" &&
              typeof item.updatedAt === "string"
            ) {
              valid.push({
                id: item.id,
                title: item.title,
                body: item.body,
                updatedAt: item.updatedAt,
              });
            } else {
              throw new Error("invalid shape");
            }
          }
          memos = valid;
        } catch (e) {
          memos = [];
          showMessage(
            "保存データが壊れていたため、空の状態から開始しました。",
            "error",
          );
        }
      }

      function renderMemos() {
        memoList.innerHTML = "";
        if (memos.length === 0) {
          emptyState.classList.remove("hidden");
          return;
        }
        emptyState.classList.add("hidden");

        memos
          .slice()
          .sort((a, b) => (a.updatedAt < b.updatedAt ? 1 : -1))
          .forEach((memo) => {
            const li = document.createElement("li");
            li.className =
              "py-3 flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2";

            const left = document.createElement("div");
            left.className = "flex-1";

            const titleEl = document.createElement("div");
            titleEl.className = "font-semibold text-gray-800 break-words";
            titleEl.textContent = memo.title;

            const bodyEl = document.createElement("div");
            bodyEl.className =
              "text-sm text-gray-700 mt-1 whitespace-pre-wrap break-words";
            bodyEl.textContent = memo.body;

            const metaEl = document.createElement("div");
            metaEl.className = "text-xs text-gray-400 mt-1";
            metaEl.textContent = `更新日時: ${memo.updatedAt}`;

            left.appendChild(titleEl);
            left.appendChild(bodyEl);
            left.appendChild(metaEl);

            const right = document.createElement("div");
            right.className = "flex gap-2 sm:ml-4";

            const editBtn = document.createElement("button");
            editBtn.className =
              "text-xs px-3 py-1 rounded bg-green-600 hover:bg-green-700 text-white";
            editBtn.textContent = "編集";
            editBtn.addEventListener("click", () => {
              loadMemoIntoForm(memo.id);
            });

            const deleteBtn = document.createElement("button");
            deleteBtn.className =
              "text-xs px-3 py-1 rounded bg-red-600 hover:bg-red-700 text-white";
            deleteBtn.textContent = "削除";
            deleteBtn.addEventListener("click", () => {
              deleteMemo(memo.id);
            });

            right.appendChild(editBtn);
            right.appendChild(deleteBtn);

            li.appendChild(left);
            li.appendChild(right);

            memoList.appendChild(li);
          });
      }

      function resetForm() {
        memoIdInput.value = "";
        titleInput.value = "";
        bodyInput.value = "";
        formError.textContent = "";
        updateBodyCount();
      }

      function loadMemoIntoForm(id) {
        const memo = memos.find((m) => m.id === id);
        if (!memo) return;
        memoIdInput.value = memo.id;
        titleInput.value = memo.title;
        bodyInput.value = memo.body;
        formError.textContent = "";
        updateBodyCount();
      }

      function deleteMemo(id) {
        const before = memos.slice();
        memos = memos.filter((m) => m.id !== id);
        if (memos.length === before.length) {
          return;
        }
        saveMemos();
        renderMemos();
        if (memoIdInput.value === id) {
          resetForm();
        }
      }

      memoForm.addEventListener("submit", (event) => {
        event.preventDefault();
        formError.textContent = "";
        clearMessages();

        const id = memoIdInput.value;
        const title = titleInput.value;
        const body = bodyInput.value;

        const error = validateInput(title, body);
        if (error) {
          formError.textContent = error;
          return;
        }

        const now = new Date().toISOString();

        if (id) {
          const index = memos.findIndex((m) => m.id === id);
          if (index !== -1) {
            const original = memos[index];
            const updated = {
              id: original.id,
              title: title,
              body: body,
              updatedAt: now,
            };
            const newMemos = memos.slice();
            newMemos[index] = updated;
            memos = newMemos;
          }
        } else {
          const newMemo = {
            id: crypto.randomUUID
              ? crypto.randomUUID()
              : String(Date.now()) + Math.random(),
            title: title,
            body: body,
            updatedAt: now,
          };
          memos = [...memos, newMemo];
        }

        saveMemos();
        renderMemos();
        resetForm();
      });

      resetButton.addEventListener("click", () => {
        resetForm();
        clearMessages();
      });

      bodyInput.addEventListener("input", () => {
        updateBodyCount();
      });

      // 初期化
      loadMemos();
      renderMemos();
      updateBodyCount();
    </script>
  </body>
</html>
