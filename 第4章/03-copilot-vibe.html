<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>メモアプリ</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      textarea {
        width: 100%;
        height: 200px;
      }
      button {
        margin-top: 10px;
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <h2>メモアプリ</h2>
    <textarea id="memo"></textarea>
    <br />
    <button onclick="saveMemo()">保存</button>
    <button onclick="loadMemo()">読み込み</button>

    <script>
      function saveMemo() {
        const text = document.getElementById("memo").value;
        localStorage.setItem("memo", text);
        alert("保存しました");
      }

      function loadMemo() {
        const text = localStorage.getItem("memo") || "";
        document.getElementById("memo").value = text;
      }
    </script>
  </body>
</html>
