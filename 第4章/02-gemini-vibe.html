<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シンプルメモアプリ</title>
    <style>
      /* 全体のデザイン調整 */
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f7;
        color: #333;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 600px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
        color: #0071e3;
      }

      /* 入力エリアのスタイル */
      .input-area {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 30px;
      }

      textarea {
        width: 100%;
        height: 100px;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        resize: vertical;
      }

      textarea:focus {
        outline: none;
        border-color: #0071e3;
      }

      button {
        background-color: #0071e3;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background-color: #005bb5;
      }

      /* メモ一覧のスタイル */
      .memo-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .memo-item {
        background: #f9f9fb;
        padding: 15px;
        border-left: 5px solid #0071e3;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        white-space: pre-wrap; /* 改行を反映させる */
        word-break: break-all;
      }

      .delete-btn {
        background-color: #ff3b30;
        font-size: 12px;
        padding: 6px 10px;
        margin-left: 10px;
        border-radius: 4px;
      }

      .delete-btn:hover {
        background-color: #d32f2f;
      }

      .empty-message {
        text-align: center;
        color: #888;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📝 マイ・メモ帳</h1>

      <!-- メモ入力エリア -->
      <div class="input-area">
        <textarea
          id="memoInput"
          placeholder="ここにメモを入力してください..."
        ></textarea>
        <button onclick="addMemo()">メモを保存</button>
      </div>

      <!-- メモ表示エリア -->
      <div id="memoList" class="memo-list"></div>
    </div>

    <script>
      // ページが読み込まれた時に、保存されているメモを表示する
      document.addEventListener("DOMContentLoaded", loadMemos);

      // メモを追加する関数
      function addMemo() {
        const memoInput = document.getElementById("memoInput");
        const memoText = memoInput.value.trim();

        if (memoText === "") {
          alert("メモが空欄です！");
          return;
        }

        // 既存のメモを取得、なければ空の配列を作成
        const memos = JSON.parse(localStorage.getItem("memos")) || [];

        // 新しいメモを追加
        memos.push(memoText);

        // ローカルストレージに保存
        localStorage.setItem("memos", JSON.stringify(memos));

        // 入力欄をクリアして再描画
        memoInput.value = "";
        displayMemos();
      }

      // メモを削除する関数
      function deleteMemo(index) {
        const memos = JSON.parse(localStorage.getItem("memos")) || [];

        // 指定したインデックスのメモを削除
        memos.splice(index, 1);

        // ローカルストレージを更新
        localStorage.setItem("memos", JSON.stringify(memos));

        // 再描画
        displayMemos();
      }

      // ローカルストレージからメモを読み込んで表示する関数
      function loadMemos() {
        displayMemos();
      }

      // 画面にメモ一覧を描画する共通処理
      function displayMemos() {
        const memoList = document.getElementById("memoList");
        const memos = JSON.parse(localStorage.getItem("memos")) || [];

        // 一旦リストを空にする
        memoList.innerHTML = "";

        if (memos.length === 0) {
          memoList.innerHTML =
            '<p class="empty-message">メモはまだありません。</p>';
          return;
        }

        // メモをループ処理で画面に追加（最新のものが上に来るように逆順で回す）
        for (let i = memos.length - 1; i >= 0; i--) {
          const memoItem = document.createElement("div");
          memoItem.className = "memo-item";

          // テキスト部分の作成
          const textSpan = document.createElement("span");
          textSpan.textContent = memos[i];

          // 削除ボタンの作成
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-btn";
          deleteBtn.textContent = "削除";
          deleteBtn.onclick = function () {
            deleteMemo(i);
          };

          memoItem.appendChild(textSpan);
          memoItem.appendChild(deleteBtn);
          memoList.appendChild(memoItem);
        }
      }
    </script>
  </body>
</html>
