<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ログイン | 第8章</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <main class="max-w-md mx-auto p-6 min-h-screen flex items-center">
      <section class="w-full bg-white rounded-xl shadow-sm border border-slate-200 p-8">
        <h1 class="text-2xl font-semibold text-slate-900">ログイン</h1>
        <p class="mt-2 text-sm text-slate-600">
          資格情報を入力してください。
        </p>

        <form id="login-form" class="mt-6 space-y-4" novalidate>
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700"
              >メールアドレス</label
            >
            <input
              id="email"
              name="email"
              type="email"
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200"
              autocomplete="username"
              required
            />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-slate-700"
              >パスワード</label
            >
            <input
              id="password"
              name="password"
              type="password"
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200"
              autocomplete="current-password"
              required
            />
          </div>
          <p
            id="login-error"
            class="text-sm text-red-600"
            role="alert"
            aria-live="assertive"
            hidden
          ></p>
          <button
            type="submit"
            class="w-full rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-300"
          >
            ログイン
          </button>
        </form>
      </section>
    </main>
    <script src="./app.js"></script>
    <script>
      (function () {
        var form = document.getElementById("login-form");
        var errorEl = document.getElementById("login-error");

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          errorEl.hidden = true;
          errorEl.textContent = "";

          var email = document.getElementById("email").value.trim();
          var password = document.getElementById("password").value;
          var result = window.Chapter8Auth.login(email, password);

          if (result.ok) {
            window.location.replace("protected.html");
            return;
          }

          errorEl.textContent = result.message;
          errorEl.hidden = false;
        });
      })();
    </script>
  </body>
</html>
