<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家計簿 CSV 集計</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <main class="mx-auto max-w-4xl px-4 py-10">
    <header class="mb-8">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-800">家計簿 CSV 集計</h1>
      <p class="mt-2 text-sm text-slate-600">
        UTF-8・カンマ区切り・ヘッダ <code class="rounded bg-slate-200 px-1 py-0.5 text-xs">date,amount,category,memo</code> の CSV を選択してください。
      </p>
    </header>

    <section class="mb-6 rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
      <label for="file-input" class="block text-sm font-medium text-slate-700">ファイル選択</label>
      <input
        id="file-input"
        type="file"
        accept=".csv,text/csv,text/plain"
        class="mt-2 block w-full text-sm text-slate-600 file:mr-4 file:rounded-md file:border-0 file:bg-slate-800 file:px-4 file:py-2 file:text-sm file:font-medium file:text-white hover:file:bg-slate-700"
      />
    </section>

    <div
      id="warning-area"
      class="mb-6 hidden rounded-md border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900"
      role="status"
      aria-live="polite"
    ></div>

    <div id="error-area" class="mb-6 hidden rounded-md border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-900" role="alert"></div>

    <section class="mb-6 rounded-lg border border-slate-200 bg-white shadow-sm">
      <div class="border-b border-slate-200 px-4 py-3">
        <h2 class="text-sm font-semibold text-slate-800">月 × カテゴリ 集計</h2>
      </div>
      <div class="overflow-x-auto p-4">
        <table id="result-table" class="w-full min-w-[28rem] border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-200 text-left text-xs font-medium uppercase tracking-wide text-slate-500">
              <th class="pb-2 pr-4">月（YYYY-MM）</th>
              <th class="pb-2 pr-4">カテゴリ</th>
              <th class="pb-2 text-right">合計（円）</th>
            </tr>
          </thead>
          <tbody id="result-body">
            <tr>
              <td colspan="3" class="py-8 text-center text-slate-500">CSV をアップロードするとここに表示されます。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="flex flex-wrap gap-3">
      <button
        id="btn-download-json"
        type="button"
        disabled
        class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white shadow hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        JSON をダウンロード
      </button>
      <button
        id="btn-download-csv"
        type="button"
        disabled
        class="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-800 shadow-sm hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
      >
        CSV をダウンロード
      </button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
