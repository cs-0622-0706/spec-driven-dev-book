<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数当てゲーム</title>
    <style>
      body {
        font-family: sans-serif;
        background: linear-gradient(135deg, #74ebd5, #9face6);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }

      .game-box {
        background: white;
        padding: 30px;
        border-radius: 20px;
        width: 320px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      h1 {
        margin-top: 0;
        color: #333;
      }

      input {
        width: 80px;
        padding: 10px;
        font-size: 18px;
        text-align: center;
        margin-top: 10px;
      }

      button {
        padding: 10px 16px;
        font-size: 16px;
        margin-top: 12px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        transition: 0.2s;
      }

      button:hover {
        background: #4338ca;
      }

      #message {
        margin-top: 20px;
        font-size: 18px;
        min-height: 40px;
        color: #222;
      }

      #count {
        margin-top: 10px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="game-box">
      <h1>🎯 数当てゲーム</h1>
      <p>1〜100 の数字を当ててください！</p>

      <input type="number" id="guessInput" min="1" max="100" />
      <br />
      <button onclick="checkGuess()">予想する</button>
      <button onclick="resetGame()">リセット</button>

      <div id="message"></div>
      <div id="count"></div>
    </div>

    <script>
      let answer = Math.floor(Math.random() * 100) + 1;
      let attempts = 0;

      function checkGuess() {
        const input = document.getElementById("guessInput");
        const guess = Number(input.value);
        const message = document.getElementById("message");
        const count = document.getElementById("count");

        if (!guess || guess < 1 || guess > 100) {
          message.textContent = "1〜100 の数字を入力してください！";
          return;
        }

        attempts++;

        if (guess === answer) {
          message.textContent = `🎉 正解！ ${attempts} 回で当たりました！`;
          message.style.color = "green";
        } else if (guess < answer) {
          message.textContent = "📈 もっと大きい数字です！";
          message.style.color = "blue";
        } else {
          message.textContent = "📉 もっと小さい数字です！";
          message.style.color = "red";
        }

        count.textContent = `挑戦回数: ${attempts}`;
        input.value = "";
        input.focus();
      }

      function resetGame() {
        answer = Math.floor(Math.random() * 100) + 1;
        attempts = 0;

        document.getElementById("message").textContent = "";
        document.getElementById("count").textContent = "";
        document.getElementById("guessInput").value = "";
      }
    </script>
  </body>
</html>
