<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1〜100 数当てゲーム</title>
    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .game-container {
        background-color: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      p {
        color: #666;
        font-size: 1.1rem;
      }
      input[type="number"] {
        width: 80px;
        padding: 10px;
        font-size: 1.2rem;
        text-align: center;
        border: 2px solid #ddd;
        border-radius: 8px;
        margin-right: 10px;
        outline: none;
        transition: border-color 0.3s;
      }
      input[type="number"]:focus {
        border-color: #007bff;
      }
      button {
        padding: 10px 20px;
        font-size: 1.1rem;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #0056b3;
      }
      .message {
        margin-top: 20px;
        font-weight: bold;
        font-size: 1.2rem;
        min-height: 1.8em;
      }
      .counter {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #888;
      }
      .reset-btn {
        background-color: #28a745;
        margin-top: 15px;
        display: none;
      }
      .reset-btn:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <h1>数当てゲーム</h1>
      <p>1 から 100 の間の数を当ててみてね！</p>

      <div id="game-inputs">
        <input
          type="number"
          id="guess-input"
          min="1"
          max="100"
          placeholder="50"
        />
        <button id="guess-btn">予想する</button>
      </div>

      <div class="message" id="message"></div>
      <div class="counter" id="counter"></div>

      <button class="reset-btn" id="reset-btn">もう一度プレイする</button>
    </div>

    <script>
      // ゲームの状態を管理する変数
      let targetNumber;
      let attempts;

      // HTML要素の取得
      const guessInput = document.getElementById("guess-input");
      const guessBtn = document.getElementById("guess-btn");
      const message = document.getElementById("message");
      const counter = document.getElementById("counter");
      const resetBtn = document.getElementById("reset-btn");
      const gameInputs = document.getElementById("game-inputs");

      // ゲームの初期化関数
      function initGame() {
        targetNumber = Math.floor(Math.random() * 100) + 1; // 1〜100の乱数
        attempts = 0;
        message.textContent = "準備OK！数字を入力してね。";
        message.style.color = "#333";
        counter.textContent = "";
        guessInput.value = "";
        guessInput.disabled = false;
        gameInputs.style.display = "block";
        resetBtn.style.display = "none";
        guessInput.focus();
      }

      // 判定関数
      function checkGuess() {
        const userGuess = parseInt(guessInput.value);

        // 入力チェック
        if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
          message.textContent = "⚠️ 1〜100の正しい数字を入力してください。";
          message.style.color = "#dc3545";
          return;
        }

        attempts++;

        if (userGuess === targetNumber) {
          message.textContent = `🎉 正解！おめでとうございます！`;
          message.style.color = "#28a745";
          counter.textContent = `${attempts} 回目で当てました！`;
          endGame();
        } else if (userGuess > targetNumber) {
          message.textContent = "📉 もっと小さい数だよ！";
          message.style.color = "#17a2b8";
          counter.textContent = `試行回数: ${attempts} 回`;
        } else {
          message.textContent = "📈 もっと大きい数だよ！";
          message.style.color = "#ffc107";
          counter.textContent = `試行回数: ${attempts} 回`;
        }

        guessInput.value = "";
        guessInput.focus();
      }

      // ゲーム終了時の処理
      function endGame() {
        guessInput.disabled = true;
        gameInputs.style.display = "none";
        resetBtn.style.display = "inline-block";
        resetBtn.focus();
      }

      // イベントリスナーの登録
      guessBtn.addEventListener("click", checkGuess);

      // Enterキーでも入力できるようにする
      guessInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          checkGuess();
        }
      });

      resetBtn.addEventListener("click", initGame);

      // 最初の一回を起動
      initGame();
    </script>
  </body>
</html>
