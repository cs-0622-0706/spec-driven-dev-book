<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ToDoアプリ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded shadow">
      <h1 class="text-2xl font-bold mb-4">ToDoアプリ</h1>

      <div class="mb-4">
        <label
          for="task-input"
          class="block text-sm font-medium text-gray-700 mb-1"
          >タスク入力</label
        >
        <input
          id="task-input"
          type="text"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="タスクを入力"
        />
        <p id="error-message" class="mt-2 text-sm text-red-600 hidden"></p>
      </div>

      <div class="flex items-center justify-between mb-4">
        <button
          id="add-button"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          追加
        </button>
        <div class="text-sm text-gray-700">
          未完了件数: <span id="incomplete-count">0</span>
        </div>
      </div>

      <div>
        <h2 class="text-lg font-semibold mb-2">タスク一覧</h2>
        <ul id="task-list" class="space-y-2"></ul>
      </div>
    </div>

    <script>
      const taskInput = document.getElementById("task-input");
      const addButton = document.getElementById("add-button");
      const taskList = document.getElementById("task-list");
      const incompleteCountEl = document.getElementById("incomplete-count");
      const errorMessageEl = document.getElementById("error-message");

      /** @type {{ id: string, title: string, done: boolean, createdAt: string }[]} */
      let tasks = [];

      function renderTasks() {
        taskList.innerHTML = "";

        tasks.forEach((task) => {
          const li = document.createElement("li");
          li.className =
            "flex items-center justify-between bg-gray-50 border border-gray-200 rounded px-3 py-2";

          const left = document.createElement("div");
          left.className = "flex items-center space-x-2";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.done;
          checkbox.className = "h-4 w-4";
          checkbox.dataset.id = task.id;

          const titleSpan = document.createElement("span");
          titleSpan.textContent = task.title;
          titleSpan.className = task.done
            ? "line-through text-gray-400"
            : "text-gray-800";

          left.appendChild(checkbox);
          left.appendChild(titleSpan);

          const right = document.createElement("div");
          const deleteButton = document.createElement("button");
          deleteButton.textContent = "削除";
          deleteButton.className =
            "px-2 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700";
          deleteButton.dataset.id = task.id;

          right.appendChild(deleteButton);

          li.appendChild(left);
          li.appendChild(right);
          taskList.appendChild(li);
        });

        updateIncompleteCount();
      }

      function updateIncompleteCount() {
        const count = tasks.filter((t) => !t.done).length;
        incompleteCountEl.textContent = String(count);
      }

      function clearError() {
        errorMessageEl.textContent = "";
        errorMessageEl.classList.add("hidden");
      }

      function showError(message) {
        errorMessageEl.textContent = message;
        errorMessageEl.classList.remove("hidden");
      }

      function validateInput(value) {
        const trimmed = value.trim();
        if (trimmed.length === 0) {
          return "入力が空白のみのため追加できません";
        }
        if (trimmed.length > 100) {
          return "入力が100文字を超えるため追加できません";
        }
        return null;
      }

      function addTask() {
        const value = taskInput.value;
        const error = validateInput(value);

        if (error) {
          showError(error);
          return;
        }

        clearError();

        const newTask = {
          id: crypto.randomUUID(),
          title: value.trim(),
          done: false,
          createdAt: new Date().toISOString(),
        };

        tasks = [...tasks, newTask];
        taskInput.value = "";
        renderTasks();
      }

      function toggleTaskDone(id) {
        tasks = tasks.map((task) =>
          task.id === id ? { ...task, done: !task.done } : task,
        );
        renderTasks();
      }

      function deleteTask(id) {
        tasks = tasks.filter((task) => task.id !== id);
        renderTasks();
      }

      addButton.addEventListener("click", () => {
        addTask();
      });

      taskInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          addTask();
        }
      });

      taskList.addEventListener("click", (e) => {
        const target = e.target;
        if (target instanceof HTMLInputElement && target.type === "checkbox") {
          const id = target.dataset.id;
          if (id) {
            toggleTaskDone(id);
          }
        } else if (
          target instanceof HTMLButtonElement &&
          target.textContent === "削除"
        ) {
          const id = target.dataset.id;
          if (id) {
            deleteTask(id);
          }
        }
      });

      renderTasks();
    </script>
  </body>
</html>
