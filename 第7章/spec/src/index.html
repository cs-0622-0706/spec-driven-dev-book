<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>掲示板</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">掲示板</h1>
        <p class="lead">メッセージを投稿すると、新しい順に表示されます。</p>
      </header>

      <section class="panel form-panel" aria-labelledby="form-heading">
        <h2 id="form-heading" class="panel__title">投稿する</h2>
        <form id="post-form" class="form" novalidate>
          <div class="field">
            <label for="name" class="label">名前（任意）</label>
            <input
              id="name"
              name="name"
              type="text"
              class="input"
              maxlength="100"
              autocomplete="nickname"
              placeholder="未入力の場合は「名無し」"
            />
          </div>
          <div class="field">
            <label for="message" class="label"
              >メッセージ <span class="req">必須</span>（最大300文字）</label
            >
            <textarea
              id="message"
              name="message"
              class="input input--message"
              rows="4"
              maxlength="300"
              required
              placeholder="内容を入力してください"
            ></textarea>
            <p id="char-hint" class="hint" aria-live="polite"></p>
          </div>
          <p
            id="form-error"
            class="error"
            role="alert"
            aria-live="assertive"
            hidden
          ></p>
          <button type="submit" class="btn">投稿する</button>
        </form>
      </section>

      <section class="panel list-panel" aria-labelledby="list-heading">
        <h2 id="list-heading" class="panel__title">一覧</h2>
        <ul id="post-list" class="post-list"></ul>
        <p id="empty-state" class="empty">まだ投稿がありません。</p>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
