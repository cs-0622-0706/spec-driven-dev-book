<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>掲示板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1419;
        --surface: #1a2332;
        --border: #2d3a4d;
        --text: #e8edf4;
        --muted: #8b9cb3;
        --accent: #3d9eff;
        --accent-dim: #2563a8;
        --danger: #f87171;
        --radius: 12px;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Zen Kaku Gothic New", sans-serif;
        background: var(--bg);
        background-image:
          radial-gradient(
            ellipse 120% 80% at 50% -20%,
            rgba(61, 158, 255, 0.12),
            transparent
          ),
          radial-gradient(
            ellipse 80% 50% at 100% 100%,
            rgba(45, 58, 77, 0.4),
            transparent
          );
        color: var(--text);
        line-height: 1.6;
      }

      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }

      header {
        margin-bottom: 2rem;
      }

      header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin: 0 0 0.35rem;
        letter-spacing: 0.02em;
      }

      header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem 1.35rem;
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow);
      }

      .card h2 {
        font-size: 0.85rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 1rem;
      }

      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.4rem;
        color: var(--text);
      }

      input[type="text"],
      textarea {
        width: 100%;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.65rem 0.85rem;
        margin-bottom: 1rem;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      input[type="text"]:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(61, 158, 255, 0.2);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .row-actions {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }

      button {
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 0.65rem 1.25rem;
        transition:
          background 0.15s,
          transform 0.1s;
      }

      button:active {
        transform: scale(0.98);
      }

      .btn-primary {
        background: var(--accent);
        color: #0a0e12;
      }

      .btn-primary:hover {
        background: #5aadff;
      }

      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .btn-ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }

      .btn-ghost:hover {
        color: var(--text);
        border-color: var(--muted);
      }

      .empty {
        text-align: center;
        padding: 2.5rem 1rem;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .post-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .post {
        border-bottom: 1px solid var(--border);
        padding: 1.15rem 0;
      }

      .post:first-child {
        padding-top: 0;
      }

      .post:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .post-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
      }

      .post-time {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .post-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin: 0 0 0.4rem;
        word-break: break-word;
      }

      .post-body {
        margin: 0;
        color: var(--text);
        font-size: 0.95rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .btn-delete {
        background: transparent;
        color: var(--danger);
        padding: 0.35rem 0.65rem;
        font-size: 0.8rem;
        border-radius: 6px;
      }

      .btn-delete:hover {
        background: rgba(248, 113, 113, 0.12);
      }

      .toast {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%) translateY(120%);
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        font-size: 0.9rem;
        box-shadow: var(--shadow);
        opacity: 0;
        transition:
          transform 0.25s ease,
          opacity 0.25s ease;
        z-index: 100;
        max-width: calc(100% - 2rem);
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>掲示板</h1>
        <p>
          データはこのブラウザの localStorage に保存されます。Node.js
          は不要です。
        </p>
      </header>

      <section class="card" aria-labelledby="form-heading">
        <h2 id="form-heading">新規投稿</h2>
        <form id="post-form" novalidate>
          <label for="title">タイトル</label>
          <input
            id="title"
            name="title"
            type="text"
            maxlength="120"
            placeholder="件名を入力"
            autocomplete="off"
          />

          <label for="body">本文</label>
          <textarea
            id="body"
            name="body"
            maxlength="4000"
            placeholder="内容を入力"
          ></textarea>

          <div class="row-actions">
            <button type="submit" class="btn-primary" id="submit-btn">
              投稿する
            </button>
            <button type="button" class="btn-ghost" id="clear-draft">
              下書きを消す
            </button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="list-heading">
        <h2 id="list-heading">投稿一覧</h2>
        <ul class="post-list" id="post-list" role="list"></ul>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        var STORAGE_KEY = "bulletin-board-posts-v1";
        var DRAFT_KEY = "bulletin-board-draft-v1";

        var form = document.getElementById("post-form");
        var titleInput = document.getElementById("title");
        var bodyInput = document.getElementById("body");
        var listEl = document.getElementById("post-list");
        var toastEl = document.getElementById("toast");
        var clearDraftBtn = document.getElementById("clear-draft");
        var toastTimer = null;

        function showToast(message) {
          toastEl.textContent = message;
          toastEl.classList.add("show");
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toastEl.classList.remove("show");
          }, 2200);
        }

        function loadPosts() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            var parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
          } catch (e) {
            return [];
          }
        }

        function savePosts(posts) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
        }

        function formatDate(iso) {
          try {
            var d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            return d.toLocaleString("ja-JP", {
              year: "numeric",
              month: "short",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            });
          } catch (e) {
            return iso;
          }
        }

        function escapeHtml(s) {
          var div = document.createElement("div");
          div.textContent = s;
          return div.innerHTML;
        }

        function sortByTitle(posts) {
          return posts.slice().sort(function (a, b) {
            return a.title.localeCompare(b.title, "ja");
          });
        }

        function render() {
          var posts = sortByTitle(loadPosts());
          listEl.innerHTML = "";

          if (posts.length === 0) {
            var empty = document.createElement("li");
            empty.className = "empty";
            empty.textContent =
              "まだ投稿がありません。上のフォームから投稿してみてください。";
            listEl.appendChild(empty);
            return;
          }

          posts.forEach(function (post) {
            var li = document.createElement("li");
            li.className = "post";
            li.setAttribute("role", "listitem");

            var meta = document.createElement("div");
            meta.className = "post-meta";

            var time = document.createElement("span");
            time.className = "post-time";
            time.textContent = formatDate(post.createdAt);

            var del = document.createElement("button");
            del.type = "button";
            del.className = "btn-delete";
            del.textContent = "削除";
            del.setAttribute("aria-label", "この投稿を削除");
            del.dataset.id = post.id;

            meta.appendChild(time);
            meta.appendChild(del);

            var h3 = document.createElement("h3");
            h3.className = "post-title";
            h3.textContent = post.title;

            var p = document.createElement("p");
            p.className = "post-body";
            p.textContent = post.body;

            li.appendChild(meta);
            li.appendChild(h3);
            li.appendChild(p);
            listEl.appendChild(li);
          });
        }

        function loadDraft() {
          try {
            var raw = localStorage.getItem(DRAFT_KEY);
            if (!raw) return;
            var d = JSON.parse(raw);
            if (d && typeof d.title === "string") titleInput.value = d.title;
            if (d && typeof d.body === "string") bodyInput.value = d.body;
          } catch (e) {}
        }

        function saveDraft() {
          localStorage.setItem(
            DRAFT_KEY,
            JSON.stringify({ title: titleInput.value, body: bodyInput.value }),
          );
        }

        function clearDraft() {
          localStorage.removeItem(DRAFT_KEY);
          titleInput.value = "";
          bodyInput.value = "";
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var title = titleInput.value.trim();
          var body = bodyInput.value.trim();

          if (!title && !body) {
            showToast("タイトルか本文のどちらかを入力してください。");
            return;
          }

          var posts = loadPosts();
          posts.push({
            id: crypto.randomUUID
              ? crypto.randomUUID()
              : String(Date.now()) + "-" + Math.random().toString(36).slice(2),
            title: title || "（無題）",
            body: body || "",
            createdAt: new Date().toISOString(),
          });
          savePosts(posts);
          clearDraft();
          render();
          showToast("投稿しました。");
          titleInput.focus();
        });

        listEl.addEventListener("click", function (e) {
          var t = e.target;
          if (t.tagName !== "BUTTON" || !t.dataset.id) return;
          if (!confirm("この投稿を削除しますか？")) return;
          var id = t.dataset.id;
          var posts = loadPosts().filter(function (p) {
            return p.id !== id;
          });
          savePosts(posts);
          render();
          showToast("削除しました。");
        });

        var draftTimer = null;
        function scheduleDraftSave() {
          if (draftTimer) clearTimeout(draftTimer);
          draftTimer = setTimeout(saveDraft, 300);
        }

        titleInput.addEventListener("input", scheduleDraftSave);
        bodyInput.addEventListener("input", scheduleDraftSave);

        clearDraftBtn.addEventListener("click", function () {
          clearDraft();
          showToast("下書きを消しました。");
        });

        loadDraft();
        render();
      })();
    </script>
  </body>
</html>
